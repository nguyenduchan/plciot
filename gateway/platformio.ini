; RS485 <-> Ethernet <-> MQTT gateway. Target: WT32-ETH01 (ESP32 + LAN8720) + MAX485 module.
; MQTT client is esp-mqtt, bundled with the Arduino core, so no MQTT library is needed.
[env:wt32-eth01]
platform = espressif32@6.5.0
board = wt32-eth01
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
