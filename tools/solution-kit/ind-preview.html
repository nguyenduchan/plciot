<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xem thử giải pháp</title>
<!-- Xem thử giao diện webapp của MỘT giải pháp ở chế độ chạy thử (số mẫu theo spec), không cần đăng nhập/server.
     Phục vụ thư mục gốc repo:  python -m http.server 8766   rồi mở  http://localhost:8766/tools/solution-kit/ind-preview.html?id=boiler -->
<link rel="stylesheet" href="../../webapp/style.css">
<link rel="stylesheet" href="../../webapp/industry.css">
<style>
  body { margin: 0; padding: 12px; }
  #pick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  #pick a { padding: 4px 10px; border: 1px solid var(--line, #444); border-radius: 999px; font-size: 12px; text-decoration: none; color: inherit; }
  #pick a.on { background: var(--acc, #3b82f6); color: #fff; border-color: transparent; }
  #nav { display: flex !important; flex-direction: row !important; position: static !important; width: auto !important; height: auto !important; min-height: 0 !important; gap: 6px; margin: 8px 0; flex-wrap: wrap; box-shadow: none !important; }
  main { margin: 0 !important; padding: 0 !important; }
  #nav button { display: inline-flex; gap: 6px; align-items: center; }
  #nav button svg { width: 16px; height: 16px; }
</style>
</head>
<body>
<div id="pick"></div>
<nav id="nav"><button data-tab="dash" class="on"><span>Tổng quan</span></button><button data-tab="set"><span>Cài đặt</span></button></nav>
<main><section id="tab-dash" class="tab"></section></main>
<script>
  var cfg = { demo: true };
  const id = new URLSearchParams(location.search).get('id') || 'boiler';
  const IDS = ['water','agri','coldchain','hvac','factory','energy','ev','aqua','tank','lighting','env','compressor','facility','process','schedule','elevator','fleet','workshop','andon','boiler','generator','bts','weather','wwtp','dryer','pumpstn'];
  document.getElementById('pick').innerHTML = IDS.map((x) => `<a href="?id=${x}" class="${x === id ? 'on' : ''}">${x}</a>`).join('');
  const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = `../../solutions/${id}/webapp/theme.css`; document.head.appendChild(css);
  const load = (src) => new Promise((ok, no) => { const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = no; document.body.appendChild(s); });
  (async () => {
    await load('../../webapp/metric-icons.js');
    await load('../../webapp/icons.js');
    await load(`../../solutions/${id}/webapp/spec.js`);
    await load('../../webapp/industry-engine.js');
  })();
  document.getElementById('nav').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    document.querySelectorAll('#nav button').forEach((x) => x.classList.toggle('on', x === b));
    document.querySelectorAll('main > section').forEach((s) => { s.hidden = s.id !== 'tab-' + b.dataset.tab; });
  });
</script>
</body>
</html>
