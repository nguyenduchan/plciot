# Cổng LAN duy nhất vào Node-RED: chỉ /scada* (trang giám sát + điều khiển). Trình soạn thảo Node-RED không lộ ra LAN.
limit_req_zone $binary_remote_addr zone=scada:2m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=scada_conn:2m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 4k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    location /scada {
        limit_req zone=scada burst=40 nodelay;
        limit_conn scada_conn 20;
        proxy_pass http://nodered:1880;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;     # scada-auth.js dùng để khoá theo IP thật
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
    }
    location / { return 404; }
}
