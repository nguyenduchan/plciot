apiVersion: 1
datasources:
  - name: PLC
    uid: plciot-influx
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: ${INFLUX_ORG}
      defaultBucket: ${INFLUX_BUCKET}
      tlsSkipVerify: false
    secureJsonData:
      token: ${INFLUX_TOKEN}
