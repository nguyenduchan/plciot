# plciot broker — chạy SAU HAProxy (xem config/haproxy.cfg). Mosquitto chỉ nghe trong mạng Docker nội bộ;
# TLS, giới hạn theo IP, chống slowloris/flood nằm ở HAProxy. Ở đây giữ các giới hạn theo broker.

# --- Lưu trữ: ít ghi đĩa ---
persistence true
persistence_location /mosquitto/data/
autosave_interval 600
log_type error
log_type warning
connection_messages false

# --- Xác thực + ACL theo TỪNG listener (mặc định từ chối; mỗi user chỉ thấy plc/<site>/<device>/*) ---
# Kênh KHÔNG mã hoá dùng acl-monitor (chỉ xem); kênh đã mã hoá dùng acl (xem + điều khiển theo vai trò).
# Các file này do plciot-app ghi lại khi admin đổi quyền (mqttProvision.js).
per_listener_settings true

# --- Chống cạn tài nguyên (DoS từ client đã đăng nhập hoặc client chậm) ---
allow_zero_length_clientid false     # bắt buộc clientid → không tạo vô hạn phiên ẩn danh
max_keepalive 120                    # từ chối keepalive 0/quá lớn → socket "chết" bị dọn nhanh
persistent_client_expiration 1d      # phiên persistent bị bỏ rơi tự xoá sau 1 ngày
max_packet_size 4096                 # gói MQTT tối đa 4 KB (CONNECT/PUBLISH/SUBSCRIBE)
message_size_limit 4096
max_inflight_messages 10
max_inflight_bytes 32768
max_queued_messages 50               # hàng đợi tối đa cho client offline (QoS>0)
max_queued_bytes 65536
queue_qos0_messages false
upgrade_outgoing_qos false
max_topic_alias 0                    # MQTT5: tắt topic alias (bớt state mỗi kết nối)
memory_limit 40M                     # dưới mem_limit 64m của container: broker từ chối thay vì bị OOM-kill
set_tcp_nodelay true

# ---- Kênh KHÔNG mã hoá: MONITOR ONLY -------------------------------------------------
# 1883: mqtt:// thuần (HAProxy cổng mqtt công khai; app ingest nội bộ). 9001: ws:// thuần.
listener 1883
max_connections 400
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl-monitor

listener 9001
protocol websockets
max_connections 400
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl-monitor

# ---- Kênh ĐÃ mã hoá: MONITOR + CONTROL (theo vai trò) ---------------------------------
# CHỈ được tới từ proxy đã kết thúc TLS (HAProxy :8883, Caddy wss:443, Cloudflare Tunnel).
# TUYỆT ĐỐI không publish hai cổng này ra host/Internet và không trỏ proxy plain vào đây.
listener 1884
max_connections 400
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 9002
protocol websockets
max_connections 400
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
