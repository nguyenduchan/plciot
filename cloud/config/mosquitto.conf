# Small footprint: few clients, tiny messages, few disk writes, quiet logs.
persistence true
persistence_location /mosquitto/data/
autosave_interval 600
max_queued_messages 50
max_inflight_messages 10
max_packet_size 4096
log_type error
log_type warning
connection_messages false

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Plain MQTT: loopback-only on the host (ingest + local tests).
listener 1883
max_connections 64

# WebSocket: phones + gateways via Cloudflare Tunnel (TLS terminated at CF).
# Cap connections to limit abuse; raise if you have many gateways+apps.
listener 9001
protocol websockets
max_connections 256
