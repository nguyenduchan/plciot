# Small footprint: few clients, tiny messages, few disk writes, quiet logs.
persistence true
persistence_location /mosquitto/data/
autosave_interval 600
max_queued_messages 50
max_inflight_messages 10
max_packet_size 4096
log_type error
log_type warning
connection_messages false

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Plain MQTT: loopback-only on the host, for local tests.
listener 1883
max_connections 10

# WebSocket listener: used by both the phone app and the gateway, always behind the
# Cloudflare tunnel, which terminates TLS (wss://). Not published beyond 127.0.0.1.
listener 9001
protocol websockets
max_connections 30
