# plciot broker — chạy SAU HAProxy (xem config/haproxy.cfg). Mosquitto chỉ nghe trong mạng Docker nội bộ;
# TLS, giới hạn theo IP, chống slowloris/flood nằm ở HAProxy. Ở đây giữ các giới hạn theo broker.

# --- Lưu trữ: ít ghi đĩa ---
persistence true
persistence_location /mosquitto/data/
autosave_interval 600
log_type error
log_type warning
connection_messages false

# --- Xác thực + ACL theo TỪNG listener (mặc định từ chối) ---
# Topic: gw/<mqttId>/<kind> (id MQTT ngẫu nhiên do server cấp cho từng gateway).
# Kênh KHÔNG mã hoá dùng acl-monitor (chỉ xem); kênh đã mã hoá dùng acl (xem + điều khiển theo vai trò).
# Các file này do plciot-app ghi lại khi provision user/device (mqttProvision.js).
per_listener_settings true

# --- Chống cạn tài nguyên (DoS từ client đã đăng nhập hoặc client chậm) ---
persistent_client_expiration 1d      # phiên persistent bị bỏ rơi tự xoá sau 1 ngày
memory_limit 125829120                    # dưới mem_limit 128m của container: broker từ chối thay vì bị OOM-kill
set_tcp_nodelay true

# ---- Kênh KHÔNG mã hoá: MONITOR ONLY -------------------------------------------------
# 1883: mqtt:// thuần (HAProxy cổng mqtt công khai; app ingest nội bộ). 9001: ws:// thuần.
listener 1883
allow_zero_length_clientid false
max_keepalive 120
max_packet_size 16384
max_inflight_messages 10
max_inflight_bytes 32768
max_queued_messages 50
max_queued_bytes 65536
queue_qos0_messages false
upgrade_outgoing_qos false
max_topic_alias 0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl-monitor

# 1885: CHỈ NỘI BỘ docker (không publish cổng, không qua HAProxy) cho app ingest. Hàng đợi lớn do BROKER giữ:
# app đăng ký QoS 1 + phiên persistent; gateway publish QoS0 được nâng lên QoS1 theo người nhận nên được xếp hàng
# (tới 50.000 message / 32 MB) và còn nguyên khi app khởi động lại. Không đặt cho listener công khai vì client chậm sẽ ăn RAM.
listener 1885
allow_zero_length_clientid false
max_keepalive 120
max_packet_size 16384
max_inflight_messages 200
max_inflight_bytes 262144
max_queued_messages 50000
max_queued_bytes 33554432
queue_qos0_messages true
upgrade_outgoing_qos true
max_topic_alias 0
max_connections 4
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl-monitor

listener 9001
allow_zero_length_clientid false
max_keepalive 120
max_packet_size 16384
max_inflight_messages 10
max_inflight_bytes 32768
max_queued_messages 50
max_queued_bytes 65536
queue_qos0_messages false
upgrade_outgoing_qos false
max_topic_alias 0
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl-monitor

# ---- Kênh ĐÃ mã hoá: MONITOR + CONTROL (theo vai trò) ---------------------------------
# CHỈ được tới từ proxy đã kết thúc TLS (HAProxy :8883, Caddy wss:443, Cloudflare Tunnel).
# TUYỆT ĐỐI không publish hai cổng này ra host/Internet và không trỏ proxy plain vào đây.
listener 1884
allow_zero_length_clientid false
max_keepalive 120
max_packet_size 16384
max_inflight_messages 10
max_inflight_bytes 32768
max_queued_messages 50
max_queued_bytes 65536
queue_qos0_messages false
upgrade_outgoing_qos false
max_topic_alias 0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

listener 9002
allow_zero_length_clientid false
max_keepalive 120
max_packet_size 16384
max_inflight_messages 10
max_inflight_bytes 32768
max_queued_messages 50
max_queued_bytes 65536
queue_qos0_messages false
upgrade_outgoing_qos false
max_topic_alias 0
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
