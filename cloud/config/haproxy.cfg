# Cổng vào công khai của MQTT: TLS + chống DDoS lớp kết nối. Mosquitto chỉ nhận từ đây.
#
#   :1883  MQTT không mã hóa (TCP)                  ──► mqtt:1883  (MONITOR ONLY)
#   :9001  WebSocket không mã hóa (ws://)           ──► mqtt:9001  (MONITOR ONLY)
#   :8883  MQTTS (TLS 1.2+, Let's Encrypt)          ──► mqtt:1884  (MONITOR + CONTROL theo vai trò)
#   :9002  WebSocket nội bộ cho Caddy (wss:// :443) ──► mqtt:9002  (MONITOR + CONTROL; KHÔNG publish cổng 9002)
# Quyền control chỉ có ở hai listener 1884/9002 của Mosquitto; đường dẫn mã hoá phải luôn kết thúc TLS TRƯỚC HAProxy/Mosquitto.
#
# Ngưỡng chỉnh bằng biến môi trường (xem docker-compose.vps.yml); mặc định bên dưới.
presetenv MAX_CONN_PER_IP   30       # kết nối đồng thời / IP (CGNAT điện thoại → đừng đặt quá thấp)
presetenv MAX_CONN_RATE     60       # kết nối mới / phút / IP — chặn dò mật khẩu: mỗi lần dò = 1 kết nối
presetenv BAN_CONN_RATE     300      # vượt ngưỡng này → khoá IP cho tới khi im lặng BAN_MINUTES phút
presetenv MAX_BYTES_10S     262144   # băng thông vào / 10 s / IP; vượt thì từ chối kết nối mới
presetenv MAX_TLS_RATE      100      # handshake TLS / giây toàn cục (bảo vệ CPU)
presetenv MAX_CONN_TOTAL    2000

global
    maxconn     "${MAX_CONN_TOTAL}"
    maxsslrate  "${MAX_TLS_RATE}"
    maxconnrate 300
    log stdout format raw local0 notice
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305
    tune.ssl.cachesize 20000

defaults
    log     global
    mode    tcp
    option  dontlognull
    option  tcpka
    timeout connect     5s
    timeout client      90s       # = 1,5 × max_keepalive(60) — socket im lặng bị cắt (cả khi đang bắt tay TLS)
    timeout server      90s
    timeout client-fin  10s
    timeout http-request 5s       # slowloris trên header HTTP/WebSocket
    timeout tunnel      120s      # sau khi nâng cấp WebSocket

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

# Bảng đếm theo IP (IPv4 + IPv6), dùng chung cho mọi frontend. Bản ghi hết hạn sau 10 phút im lặng.
backend t_abuse
    stick-table type ipv6 size 200k expire 10m store conn_cur,conn_rate(1m),bytes_in_rate(10s),gpc0

backend mqtt_tcp
    server mqtt mqtt:1883 resolvers docker init-addr libc,none check inter 5s

backend mqtt_tcp_secure
    server mqtt mqtt:1884 resolvers docker init-addr libc,none check inter 5s

backend mqtt_ws
    mode http
    server mqtt mqtt:9001 resolvers docker init-addr libc,none check inter 5s

backend mqtt_ws_secure
    mode http
    server mqtt mqtt:9002 resolvers docker init-addr libc,none check inter 5s

# ------------------------------------------------------------------ MQTT thuần (không mã hóa)
frontend mqtt_plain
    bind :1883
    mode tcp
    tcp-request connection accept if { src -f /usr/local/etc/haproxy/trusted.lst }
    tcp-request connection track-sc0 src table t_abuse
    tcp-request connection sc-inc-gpc0(0) if { sc0_conn_rate gt "${BAN_CONN_RATE}" }
    tcp-request connection reject if { sc0_get_gpc0 gt 0 }
    tcp-request connection reject if { sc0_conn_cur gt "${MAX_CONN_PER_IP}" }
    tcp-request connection reject if { sc0_conn_rate gt "${MAX_CONN_RATE}" }
    tcp-request connection reject if { sc0_bytes_in_rate gt "${MAX_BYTES_10S}" }
    # Phải gửi đủ một gói CONNECT (byte đầu 0x10, ≥14 byte) trong 5 s, nếu không → cắt (slowloris / rác).
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.len ge 14 } { req.payload(0,1),hex -m str 10 }
    tcp-request content reject
    default_backend mqtt_tcp

# ------------------------------------------------------------------ MQTTS (TLS)
frontend mqtt_tls
    bind :8883 ssl crt /tmp/mqtt.pem alpn mqtt
    mode tcp
    tcp-request connection accept if { src -f /usr/local/etc/haproxy/trusted.lst }
    tcp-request connection track-sc0 src table t_abuse
    tcp-request connection sc-inc-gpc0(0) if { sc0_conn_rate gt "${BAN_CONN_RATE}" }
    tcp-request connection reject if { sc0_get_gpc0 gt 0 }
    tcp-request connection reject if { sc0_conn_cur gt "${MAX_CONN_PER_IP}" }
    tcp-request connection reject if { sc0_conn_rate gt "${MAX_CONN_RATE}" }
    tcp-request connection reject if { sc0_bytes_in_rate gt "${MAX_BYTES_10S}" }
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.len ge 14 } { req.payload(0,1),hex -m str 10 }
    tcp-request content reject
    default_backend mqtt_tcp_secure

# ------------------------------------------------------------------ WebSocket không mã hóa (ws://)
frontend ws_plain
    bind :9001
    mode http
    tcp-request connection accept if { src -f /usr/local/etc/haproxy/trusted.lst }
    tcp-request connection track-sc0 src table t_abuse
    tcp-request connection sc-inc-gpc0(0) if { sc0_conn_rate gt "${BAN_CONN_RATE}" }
    tcp-request connection reject if { sc0_get_gpc0 gt 0 }
    tcp-request connection reject if { sc0_conn_cur gt "${MAX_CONN_PER_IP}" }
    tcp-request connection reject if { sc0_conn_rate gt "${MAX_CONN_RATE}" }
    tcp-request connection reject if { sc0_bytes_in_rate gt "${MAX_BYTES_10S}" }
    http-request deny deny_status 400 unless { hdr(Upgrade) -i websocket }
    default_backend mqtt_ws        # không mã hoá → listener MONITOR ONLY

# ------------------------------------------------------------------ WebSocket sau Caddy (wss://, TLS do Caddy)
# Nguồn thật lấy từ X-Forwarded-For do Caddy ghi đè. Cổng này chỉ nằm trong mạng Docker.
frontend ws_behind_caddy
    bind :9002
    mode http
    http-request set-src hdr(x-forwarded-for) if { hdr_cnt(x-forwarded-for) eq 1 }
    http-request track-sc0 src table t_abuse unless { src -f /usr/local/etc/haproxy/trusted.lst }
    http-request sc-inc-gpc0(0) if { sc0_conn_rate gt "${BAN_CONN_RATE}" }
    http-request deny deny_status 429 if { sc0_get_gpc0 gt 0 }
    http-request deny deny_status 429 if { sc0_conn_cur gt "${MAX_CONN_PER_IP}" }
    http-request deny deny_status 429 if { sc0_conn_rate gt "${MAX_CONN_RATE}" }
    http-request deny deny_status 400 unless { hdr(Upgrade) -i websocket }
    default_backend mqtt_ws_secure   # TLS do Caddy kết thúc → listener có CONTROL
