# Self-contained stack, isolated from any other Docker project on this machine:
# own compose project name, own containers/network/volume.
# - Webapp/API: Cloudflare Tunnel (HTTPS, không mở cổng app ra ngoài).
# - MQTTS thẳng VPS: HAProxy :PUB_PORT_MQTTS → Mosquitto 1884 (SCADA C# / gateway mqtts).
name: plciot

services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: plciot-mqtt
    restart: unless-stopped
    # Số tiến trình Mosquitto theo MQTT_SHARDS (mqtt-entrypoint.sh tự tạo + ghim mỗi tiến trình một core bằng taskset, nên không cần giới hạn cpus).
    # RAM: container cần ~64 MB cho mỗi nhóm (đặt MQTT_MEM_LIMIT theo số nhóm).
    mem_limit: ${MQTT_MEM_LIMIT:-128m}
    pids_limit: 128
    entrypoint: ["/bin/sh", "/mosquitto/config/mqtt-entrypoint.sh"]
    environment:
      MQTT_SHARDS: ${MQTT_SHARDS:-1}                      # số tiến trình Mosquitto (1..16 hoặc auto = số core - MQTT_RESERVE_CORES)
      MQTT_RESERVE_CORES: ${MQTT_RESERVE_CORES:-1}         # chỉ dùng khi MQTT_SHARDS=auto: core dành cho app/haproxy/hệ điều hành
    ports:                       # loopback only (thử trên máy); Internet vào MQTT qua HAProxy hoặc tunnel
      - "127.0.0.1:21883:1883"   # không mã hoá → MONITOR ONLY
      - "127.0.0.1:29001:9001"   # không mã hoá → MONITOR ONLY
      - "127.0.0.1:21884:1884"   # kênh có CONTROL: chỉ để thử trên chính máy này, KHÔNG mở ra ngoài
      - "127.0.0.1:29002:9002"
    volumes:
      - ./config:/mosquitto/config
      - mqtt-data:/mosquitto/data
    networks: [plciot]

  # MQTTS công khai thẳng VPS (không qua Cloudflare). C#/gateway: mqtts://<IP|domain>:48263
  haproxy:
    image: haproxy:2.8-alpine
    container_name: plciot-haproxy
    restart: unless-stopped
    mem_limit: 128m
    cpus: 1.0
    pids_limit: 64
    user: root
    entrypoint: ["/bin/sh", "/usr/local/etc/haproxy/haproxy-entrypoint.sh"]
    environment:
      MQTT_DOMAIN: ${MQTT_DOMAIN:-plc-mqtt.dieukhientudong.net}
      MQTT_SHARDS: ${MQTT_SHARDS:-1}                      # số tiến trình Mosquitto (1..16 hoặc auto = số core - MQTT_RESERVE_CORES)
      MQTT_RESERVE_CORES: ${MQTT_RESERVE_CORES:-1}         # chỉ dùng khi MQTT_SHARDS=auto: core dành cho app/haproxy/hệ điều hành
      MQTT_PUBLIC_IP: ${MQTT_PUBLIC_IP:-}
      MAX_CONN_PER_IP: ${MAX_CONN_PER_IP:-30}
      MAX_CONN_RATE: ${MAX_CONN_RATE:-60}
      BAN_CONN_RATE: ${BAN_CONN_RATE:-300}
      MAX_BYTES_10S: ${MAX_BYTES_10S:-262144}
      MAX_TLS_RATE: ${MAX_TLS_RATE:-100}
    ports:
      - "${PUB_PORT_MQTTS:-48263}-${PUB_PORT_MQTTS_END:-48278}:8883-8898"   # mqtts:// — nhóm k nghe cổng gốc + k (tối đa 16 nhóm); CONTROL theo ACL
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./config/trusted.lst:/usr/local/etc/haproxy/trusted.lst:ro
      - ./config/haproxy-entrypoint.sh:/usr/local/etc/haproxy/haproxy-entrypoint.sh:ro
      - caddy-data:/caddy:ro
      - mqtt-cert:/persist   # chứng chỉ self-signed của MQTTS: giữ qua các lần tạo lại container
    depends_on: [mqtt]
    networks: [plciot]

  app:                           # Login API + per-user webapp bundles (SQLite user → folder_path)
    build:                       # context = gốc repo vì app dùng packages/security
      context: ..
      dockerfile: cloud/app/Dockerfile
    container_name: plciot-app
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    ports:
      - "127.0.0.1:3080:3080"
    environment:
      PORT: "3080"
      DATA_DIR: /app/data
      SHELL_DIR: /app/shell
      WEBAPP_SRC: /app/shell
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      WEBAPP_PUBLIC_URL: ${WEBAPP_PUBLIC_URL:-https://plc.dieukhientudong.net}
      MQTT_URL: mqtt://mqtt:1883
      MQTT_INGEST_URL: mqtt://mqtt:1885   # listener nội bộ có hàng đợi lớn của broker (xem config/mosquitto.conf)
      MQTT_SHARDS: ${MQTT_SHARDS:-1}   # số nhóm Mosquitto: số (1..16) hoặc auto; phải giống service mqtt; xem docs/SHARDING.md
      MQTT_RESERVE_CORES: ${MQTT_RESERVE_CORES:-1}
      MQTT_USER: ${MQTT_NOTIFY_USER:-ingest}
      MQTT_PASS: ${MQTT_NOTIFY_PASS:-}
      MQTT_INGEST: ${MQTT_INGEST:-true}
      # Endpoint mqtts công khai (trả trong /api/health + provision) — SCADA/gateway nối thẳng VPS
      MQTT_PUBLIC_HOST: ${MQTT_PUBLIC_HOST:-}
      MQTT_DOMAIN: ${MQTT_DOMAIN:-plc-mqtt.dieukhientudong.net}
      MQTT_PUBLIC_MQTTS_PORT: ${PUB_PORT_MQTTS:-48263}
      MQTT_PUBLIC_WSS: ${MQTT_PUBLIC_WSS:-}
      MQTT_PUBLIC_PIN_SHA256: ${MQTT_PUBLIC_PIN_SHA256:-}
      # Điều khiển qua server (step-up Passkey/TOTP) — xem docs/CONTROL-SECURITY.md
      CONTROL_VIA_SERVER: ${CONTROL_VIA_SERVER:-true}
      CONTROL_STEPUP: ${CONTROL_STEPUP:-true}
      MQTT_CONTROL_URL: ${MQTT_CONTROL_URL:-mqtt://mqtt:1884}
      MQTT_CONTROL_USER: ${MQTT_CONTROL_USER:-ctl}
      MQTT_CONTROL_PASS: ${MQTT_CONTROL_PASS:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
      CONTROL_PASSKEY_TTL_SEC: ${CONTROL_PASSKEY_TTL_SEC:-300}
      CONTROL_TOTP_TTL_SEC: ${CONTROL_TOTP_TTL_SEC:-300}
      CONTROL_BIND_NET: ${CONTROL_BIND_NET:-false}
      FIRST_DEVICE_ONLY: ${FIRST_DEVICE_ONLY:-false}
      DEVICE_TRUST_DAYS: ${DEVICE_TRUST_DAYS:-30}
      # PHASE TEST: true = đăng nhập mật khẩu trên máy mới không đòi passkey máy cũ / mã khôi phục. PRODUCTION: false.
      ALLOW_NEW_DEVICE_PASSWORD_LOGIN: ${ALLOW_NEW_DEVICE_PASSWORD_LOGIN:-false}
      # PHASE TEST: true = không khoá lại phiên khi tải trang/ở nền/idle (vẫn phải đăng nhập). PRODUCTION: đặt false.
      APP_LOCK_DISABLED: ${APP_LOCK_DISABLED:-false}
      # PHASE TEST: true = thao tác nhạy cảm (admin ghi, đổi cài đặt) không đòi xác thực lại. PRODUCTION: đặt false.
      REAUTH_DISABLED: ${REAUTH_DISABLED:-false}
      ACTIVATE_OPEN: ${ACTIVATE_OPEN:-true}
      ACTIVATE_FACEID_DISABLED: ${ACTIVATE_FACEID_DISABLED:-false}
      CONTROL_LAN_CIDRS: ${CONTROL_LAN_CIDRS:-}
      CONTROL_CRITICAL_ADDRS: ${CONTROL_CRITICAL_ADDRS:-4,6}
      CONTROL_PHYSICAL_BIT: ${CONTROL_PHYSICAL_BIT:-}
      DEVICE_ADD_COOLING_HOURS: ${DEVICE_ADD_COOLING_HOURS:-24}
      CONTROL_ENROLL_GRACE_DAYS: ${CONTROL_ENROLL_GRACE_DAYS:-3}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-72}
      CONTROL_REG_LIMITS: ${CONTROL_REG_LIMITS:-}
      CSP_CONNECT_EXTRA: ${CSP_CONNECT_EXTRA:-}
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
      MQTT_INGEST_MIN_MS: ${MQTT_INGEST_MIN_MS:-0}
      HISTORY_DEFAULT_DAYS: ${HISTORY_DEFAULT_DAYS:-1}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}   # lịch sử đăng nhập + điều khiển (audit_log): 1 năm
      HISTORY_OPEN_ACCESS: ${HISTORY_OPEN_ACCESS:-false}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      ADMIN_ONLY_CIDRS: ${ADMIN_ONLY_CIDRS:-}
      ADMIN_INTERNET_USERS: ${ADMIN_INTERNET_USERS:-}
      ADMIN_SSH_LOGIN: ${ADMIN_SSH_LOGIN:-false}
      ADMIN_HOST: ${ADMIN_HOST:-}                       # tên miền admin riêng (docs/ADMIN-SITE.md)
      ADMIN_REQUIRE_TOTP: ${ADMIN_REQUIRE_TOTP:-true}
      ADMIN_REQUIRE_FACEID: ${ADMIN_REQUIRE_FACEID:-true}      # Face ID/vân tay bắt buộc khi đăng nhập admin (docs/ADMIN-SITE.md)
      ADMIN_WEBAUTHN_ORIGINS: ${ADMIN_WEBAUTHN_ORIGINS:-}      # thêm origin khi vào qua đường hầm SSH, vd. http://localhost:8080
      ADMIN_SESSION_HOURS: ${ADMIN_SESSION_HOURS:-8}
      SUPPORT_DAILY_CAP: ${SUPPORT_DAILY_CAP:-100}             # chat hỗ trợ (docs/CHAT-COMPLIANCE.md)
      SUPPORT_RETENTION_DAYS: ${SUPPORT_RETENTION_DAYS:-0}
      SUPPORT_MAX_MESSAGES: ${SUPPORT_MAX_MESSAGES:-200}
      SUPPORT_ARCHIVE_MAX: ${SUPPORT_ARCHIVE_MAX:-5000}
      SUPPORT_IMAGE_ARCHIVE_DAYS: ${SUPPORT_IMAGE_ARCHIVE_DAYS:-730}
      SUPPORT_USER_IMAGE_BYTES: ${SUPPORT_USER_IMAGE_BYTES:-31457280}
      SUPPORT_GLOBAL_IMAGE_BYTES: ${SUPPORT_GLOBAL_IMAGE_BYTES:-1073741824}
      SUPPORT_GLOBAL_MESSAGES: ${SUPPORT_GLOBAL_MESSAGES:-300000}
      SUPPORT_IP_PER_MIN: ${SUPPORT_IP_PER_MIN:-30}
      SUPPORT_GLOBAL_PER_MIN: ${SUPPORT_GLOBAL_PER_MIN:-300}
      PRICING_VPS_VND_MONTH: ${PRICING_VPS_VND_MONTH:-260000}      # ước tính báo giá cho admin (docs/CHAT-COMPLIANCE.md)
      PRICING_CAPACITY_WIDGETS: ${PRICING_CAPACITY_WIDGETS:-500}
      DB_BACKUP: ${DB_BACKUP:-1}
      DB_BACKUP_DAILY: ${DB_BACKUP_DAILY:-7}
      DB_BACKUP_WEEKLY: ${DB_BACKUP_WEEKLY:-4}
      # PHASE TEST: nâng tạm tài khoản test lên admin. PRODUCTION: đặt rỗng.
      TEST_ADMIN_USERNAMES: ${TEST_ADMIN_USERNAMES:-}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_API: ${RATE_LIMIT_API:-120}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10}
      MQTT_CONFIG_DIR: /mosquitto/config
      MQTT_DOCKER_CONTAINER: plciot-mqtt
      # Đồng bộ GitHub từ Console (Monitor) — xem docs/ADMIN-REMOTE.md
      DEPLOY_ENABLED: ${DEPLOY_ENABLED:-false}
      DEPLOY_REPO_DIR: ${DEPLOY_REPO_DIR:-/repo}
      DEPLOY_GIT_REMOTE: ${DEPLOY_GIT_REMOTE:-origin}
      DEPLOY_GIT_BRANCH: ${DEPLOY_GIT_BRANCH:-main}
      DEPLOY_COMPOSE_FILE: ${DEPLOY_COMPOSE_FILE:-/repo/cloud/docker-compose.yml}
      DEPLOY_COMPOSE_PROJECT: ${DEPLOY_COMPOSE_PROJECT:-plciot}
      DEPLOY_APP_SERVICE: ${DEPLOY_APP_SERVICE:-app}
      DEBUG_CLIENT_TRACE: ${DEBUG_CLIENT_TRACE:-false}
      # Khoá công khai xác minh chữ ký tem QR (khoá riêng KHÔNG để trên server; ký bằng máy provision)
      CLAIM_ROOT_PUBLIC_KEY: ${CLAIM_ROOT_PUBLIC_KEY:-}
      # PHASE TEST: khoá riêng nằm trên VPS để trang admin tự ký QR mỗi lần (Thêm & tạo QR / reissue). PRODUCTION: bỏ biến này.
      CLAIM_ROOT_PRIVATE_KEY: ${CLAIM_ROOT_PRIVATE_KEY:-}
      DEBUG_TRACE_TOKEN: ${DEBUG_TRACE_TOKEN:-}
      DEBUG_TRACE_USERS: ${DEBUG_TRACE_USERS:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app/data:/app/data
      - ../webapp:/app/shell:ro
      # Repo Git (đọc/ghi). Nên đặt DEPLOY_REPO_HOST=đường_dẫn_tuyệt_đối trên VPS
      # (vd /opt/plciot) và DEPLOY_REPO_DIR giống vậy để `docker compose` rebuild đúng path host.
      - ${DEPLOY_REPO_HOST:-..}:${DEPLOY_REPO_DIR:-/repo}
      - ./config:/mosquitto/config
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [mqtt]
    networks: [plciot]

  tunnel:                        # Cloudflare Tunnel: wss broker + HTTPS app, no open ports
    image: cloudflare/cloudflared:latest
    container_name: plciot-tunnel
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}   # a NEW tunnel dedicated to this project
    depends_on: [mqtt, app]
    networks: [plciot]

networks:
  plciot:
    name: plciot_net

volumes:
  mqtt-cert:
  mqtt-data:
    name: plciot_mqtt_data
  caddy-data:
    name: plciot_caddy_data
