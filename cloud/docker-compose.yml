# Self-contained stack, isolated from any other Docker project on this machine:
# own compose project name, own containers/network/volume, own loopback-only host ports.
name: plciot

services:
  mqtt:
    image: eclipse-mosquitto:2
    container_name: plciot-mqtt
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    ports:                       # loopback only; the internet reaches the broker through the tunnel
      - "127.0.0.1:21883:1883"   # không mã hoá → MONITOR ONLY
      - "127.0.0.1:29001:9001"   # không mã hoá → MONITOR ONLY
      - "127.0.0.1:21884:1884"   # kênh có CONTROL: chỉ để thử trên chính máy này, KHÔNG mở ra ngoài
      - "127.0.0.1:29002:9002"
    volumes:
      - ./config:/mosquitto/config
      - mqtt-data:/mosquitto/data
    networks: [plciot]

  app:                           # Login API + per-user webapp bundles (SQLite user → folder_path)
    build:                       # context = gốc repo vì app dùng packages/security
      context: ..
      dockerfile: cloud/app/Dockerfile
    container_name: plciot-app
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    ports:
      - "127.0.0.1:3080:3080"
    environment:
      PORT: "3080"
      DATA_DIR: /app/data
      SHELL_DIR: /app/shell
      WEBAPP_SRC: /app/shell
      APP_JWT_SECRET: ${APP_JWT_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_POLLING: ${TELEGRAM_BOT_POLLING:-false}
      TELEGRAM_NOTIFY_CHAT_IDS: ${TELEGRAM_NOTIFY_CHAT_IDS:-}
      TELEGRAM_SHARED_PG_HOST: ${TELEGRAM_SHARED_PG_HOST:-host.docker.internal}
      TELEGRAM_SHARED_PG_PORT: ${TELEGRAM_SHARED_PG_PORT:-5432}
      TELEGRAM_SHARED_PG_USER: ${TELEGRAM_SHARED_PG_USER:-}
      TELEGRAM_SHARED_PG_PASSWORD: ${TELEGRAM_SHARED_PG_PASSWORD:-}
      TELEGRAM_SHARED_PG_DB: ${TELEGRAM_SHARED_PG_DB:-iot_postgres}
      TELEGRAM_SHARED_DATABASE_URL: ${TELEGRAM_SHARED_DATABASE_URL:-}
      WEBAPP_PUBLIC_URL: ${WEBAPP_PUBLIC_URL:-https://plc.dieukhientudong.net}
      MQTT_URL: mqtt://mqtt:1883
      MQTT_USER: ${MQTT_NOTIFY_USER:-ingest}
      MQTT_PASS: ${MQTT_NOTIFY_PASS:-}
      MQTT_INGEST: ${MQTT_INGEST:-true}
      # Điều khiển qua server (step-up Passkey/TOTP) — xem docs/CONTROL-SECURITY.md
      CONTROL_VIA_SERVER: ${CONTROL_VIA_SERVER:-true}
      CONTROL_STEPUP: ${CONTROL_STEPUP:-true}
      MQTT_CONTROL_URL: ${MQTT_CONTROL_URL:-mqtt://mqtt:1884}
      MQTT_CONTROL_USER: ${MQTT_CONTROL_USER:-ctl}
      MQTT_CONTROL_PASS: ${MQTT_CONTROL_PASS:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
      CONTROL_PASSKEY_TTL_SEC: ${CONTROL_PASSKEY_TTL_SEC:-300}
      CONTROL_TOTP_TTL_DAYS: ${CONTROL_TOTP_TTL_DAYS:-7}
      CONTROL_BIND_NET: ${CONTROL_BIND_NET:-true}
      CONTROL_LAN_CIDRS: ${CONTROL_LAN_CIDRS:-}
      CONTROL_CRITICAL_ADDRS: ${CONTROL_CRITICAL_ADDRS:-4,6}
      CONTROL_PHYSICAL_BIT: ${CONTROL_PHYSICAL_BIT:-}
      DEVICE_ADD_COOLING_HOURS: ${DEVICE_ADD_COOLING_HOURS:-24}
      CONTROL_ENROLL_GRACE_DAYS: ${CONTROL_ENROLL_GRACE_DAYS:-3}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-72}
      CONTROL_REG_LIMITS: ${CONTROL_REG_LIMITS:-}
      CSP_CONNECT_EXTRA: ${CSP_CONNECT_EXTRA:-}
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
      OTP_REQ_PER_PHONE_HOUR: ${OTP_REQ_PER_PHONE_HOUR:-6}
      OTP_FAIL_PER_PHONE_15MIN: ${OTP_FAIL_PER_PHONE_15MIN:-10}
      MQTT_INGEST_MIN_MS: ${MQTT_INGEST_MIN_MS:-0}
      HISTORY_DEFAULT_DAYS: ${HISTORY_DEFAULT_DAYS:-3}
      HISTORY_OPEN_ACCESS: ${HISTORY_OPEN_ACCESS:-false}
      ADMIN_PHONES: ${ADMIN_PHONES:-}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_API: ${RATE_LIMIT_API:-120}
      RATE_LIMIT_AUTH: ${RATE_LIMIT_AUTH:-10}
      RATE_LIMIT_OTP: ${RATE_LIMIT_OTP:-5}
      MQTT_CONFIG_DIR: /mosquitto/config
      MQTT_DOCKER_CONTAINER: plciot-mqtt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app/data:/app/data
      - ../webapp:/app/shell:ro
      - ./config:/mosquitto/config
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [mqtt, telegram-db]
    networks: [plciot]

  telegram-db:                   # Postgres chứa telegram_users (SĐT ↔ chat_id), chỉ trong mạng Docker
    image: postgres:15-alpine
    container_name: plciot-telegram-db
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_USER: ${TELEGRAM_SHARED_PG_USER}
      POSTGRES_PASSWORD: ${TELEGRAM_SHARED_PG_PASSWORD}
      POSTGRES_DB: ${TELEGRAM_SHARED_PG_DB:-iot_postgres}
    volumes:
      - telegram-pg:/var/lib/postgresql/data
    networks: [plciot]

  telegram-bot:                  # Bot Telegram (long-polling): /start + chia sẻ SĐT → telegram_users
    build: ./telegram-bot
    container_name: plciot-telegram-bot
    restart: unless-stopped
    mem_limit: 128m
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DB_TYPE: postgresql
      POSTGRES_HOST: telegram-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${TELEGRAM_SHARED_PG_USER}
      POSTGRES_PASSWORD: ${TELEGRAM_SHARED_PG_PASSWORD}
      POSTGRES_DB: ${TELEGRAM_SHARED_PG_DB:-iot_postgres}
      DB_POOL_SIZE: "5"
    depends_on: [telegram-db]
    networks: [plciot]

  tunnel:                        # Cloudflare Tunnel: wss broker + HTTPS app, no open ports
    image: cloudflare/cloudflared:latest
    container_name: plciot-tunnel
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.5
    pids_limit: 64
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}   # a NEW tunnel dedicated to this project
    depends_on: [mqtt, app]
    networks: [plciot]

networks:
  plciot:
    name: plciot_net

volumes:
  telegram-pg:
    name: mqtt_server_postgres_data   # dùng lại volume cũ để giữ nguyên telegram_users
    external: true
  mqtt-data:
    name: plciot_mqtt_data
