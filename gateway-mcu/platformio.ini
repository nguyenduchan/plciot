; Gateway MCU: Waveshare ESP32-S3-POE-ETH-8DI-8DO (ESP32-S3-WROOM-1U-N16R8, W5500, RS485, 8 DI, 8 DO qua TCA9554).
; Cấu hình qua LAN bằng GatewayApp (nút "Kết nối Waveshare (LAN)") — cùng API JSON với gateway PC (tools/GatewayApp/Remote/Contract.cs).
; Cần Arduino-ESP32 3.x (ETH.begin cho W5500, NetworkClientSecure): dùng nền tảng pioarduino, GHIM bản 3.3.13 — "stable" đã lên Arduino 4.0 (mbedtls mới, mất mbedtls/sha256.h) nên chưa build được.
[env:waveshare-s3-eth-8di-8do]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.313/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFW_VERSION=\"mcu-0.4.1\"
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    knolleary/PubSubClient@2.8

; BẢN DEV (chỉ nạp USB cho board thử nghiệm): tin THÊM khoá ký dev (KHÔNG phải khoá phát hành):
;   FW_DEV_PUBKEY2 = khoá trên VPS /root/.plciot/fw-sign-dev.pem (ký qua SSH: cloud/scripts/sign-fw-vps.ps1) — đường chính;
;   FW_DEV_PUBKEY  = khoá cũ ~/.plciot/fw-sign-dev.pem ở PC nhà (bỏ khi không còn dùng)
; và tải bản mới từ kênh "dev" của server (releases/mcu-dev). Phiên bản đặt khi build:
;   $env:PLATFORMIO_BUILD_FLAGS='-DFW_VERSION=\"mcu-0.4.2-dev\"'; pio run -e waveshare-dev
; Thêm -DFW_TEST_BREAK_CLOUD để build bản HỎNG CÓ CHỦ ĐÍCH (không nối cloud) — thử tự quay về firmware cũ.
[env:waveshare-dev]
extends = env:waveshare-s3-eth-8di-8do
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFW_CHANNEL=\"dev\"
    -DFW_DEV_PUBKEY=\"MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE0TfFRFggoEkVAJRdaUc2cwjMR0VmxIU9kZ_r45E94h87tiZjwoJx3nLscRu_b2MBv74_dtsW9yQfRZvf_Bm3MQ\"
    -DFW_DEV_PUBKEY2=\"MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEr_WQ3O0rtoj3Nlbg9kHhP1e-VwGR8buB_CtAXadEdKbjWvK1bIdKRjMfsE3k28nqB2Znyd6fpnOdyuXC9ACC1A\"
