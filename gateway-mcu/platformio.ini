; Gateway MCU: Waveshare ESP32-S3-POE-ETH-8DI-8DO (ESP32-S3-WROOM-1U-N16R8, W5500, RS485, 8 DI, 8 DO qua TCA9554).
; Cấu hình qua LAN bằng GatewayApp (nút "Kết nối Waveshare (LAN)") — cùng API JSON với gateway PC (tools/GatewayApp/Remote/Contract.cs).
; Cần Arduino-ESP32 3.x (ETH.begin cho W5500, NetworkClientSecure): dùng nền tảng pioarduino.
[env:waveshare-s3-eth-8di-8do]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFW_VERSION=\"mcu-0.1.0\"
lib_deps =
    bblanchon/ArduinoJson@7.2.1
    knolleary/PubSubClient@2.8
